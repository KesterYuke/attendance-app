name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Show directory structure
      run: |
        pwd
        ls -la
        echo "Checking for buildozer.spec..."
        if [ -f "buildozer.spec" ]; then
          echo "buildozer.spec found!"
          cat buildozer.spec | head -30
        else
          echo "buildozer.spec NOT found!"
        fi
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv
    
    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        pip3 install buildozer
    
    - name: Initialize Buildozer if needed
      run: |
        if [ ! -f "buildozer.spec" ]; then
          echo "Initializing Buildozer..."
          buildozer init
          # Configure buildozer.spec
          sed -i 's/app_name = My Application/app_name = 考勤助手/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = attendance/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org/' buildozer.spec
          sed -i 's/source.dir = ./source.dir = ./' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
          sed -i 's/main.py/my_attendance_gui.py/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.1,plyer,python-dateutil/' buildozer.spec
          sed -i 's/android.permissions =/android.permissions = INTERNET,ACCESS_NETWORK_STATE,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/android.arch = armeabi-v7a/android.arch = arm64-v8a/' buildozer.spec
          echo "Buildozer initialized and configured!"
        else
          echo "Using existing buildozer.spec..."
        fi
    
    - name: Build APK (with detailed logs)
      id: build
      run: |
        echo "Starting build process..."
        buildozer android debug --verbose 2>&1 | tee build.log
    
    - name: Show build log tail
      if: always()
      run: |
        echo "Last 50 lines of build.log:"
        tail -50 build.log || echo "No build.log found"
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 30
