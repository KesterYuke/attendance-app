name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Debug environment
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        echo "Checking for buildozer.spec..."
        if [ -f "buildozer.spec" ]; then
          echo "buildozer.spec found!"
          head -20 buildozer.spec
        else
          echo "buildozer.spec NOT found!"
        fi

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv

    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        pip3 install buildozer
        buildozer --version

    - name: Build APK
      run: |
        mkdir -p build-logs
        buildozer android debug --verbose > build-logs/build.log 2>&1
        EXIT_CODE=$?
        echo "Build exit code: $EXIT_CODE"
        ls -la
        ls -la bin/ || echo "bin directory not found"
        tail -100 build-logs/build.log
        return $EXIT_CODE

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          build-logs/
          bin/*.apk
          *.apk
        retention-days: 30
