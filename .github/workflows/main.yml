name: Build Android APK

on:
  push:
    branches: [ main ]  # 推送代码到 main 分支时触发
  pull_request:
    branches: [ main ]  # 提交 PR 到 main 分支时触发
  workflow_dispatch:  # 允许手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 最新版本作为构建环境

    steps:
    - uses: actions/checkout@v4  # 检出仓库代码

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # 使用 Python 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer

    - name: Build APK
      run: |
        # 设置 Buildozer 缓存目录
        export BUILDOZER_CACHE_DIR=~/.buildozer
        # 执行构建命令
        buildozer android debug --verbose

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-apk  # 构建产物名称
        path: bin/*.apk  # 上传 bin 目录下的所有 APK 文件
        retention-days: 30  # 构建产物保留 30 天
