name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest  # 使用官方 Buildozer 镜像，包含所有必要依赖
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Check current directory
      run: pwd && ls -la
    
    - name: Build APK
      id: build
      run: |
        echo "Building APK..."
        buildozer android debug --verbose
      
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-apk
        path: bin/*.apk
        retention-days: 30
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/outputs/logs/
          .buildozer/android/logs/
        retention-days: 30
